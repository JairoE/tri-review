name: 'tri-review'
description: 'Have three LLMs independently review a pull request, and report what they agree on.'
author: 'JairoE'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  pr-number:
    description: 'PR number to review. Defaults to the number of the PR that triggered this run.'
    required: false
  models:
    description: 'Space-separated model IDs, e.g. "gpt-5.6-terra claude-sonnet-5 gemini-3.7-flash". Leave empty for the configured defaults.'
    required: false
  exclude:
    description: 'Newline-separated glob patterns to drop from the diff, e.g. "**/*.lock".'
    required: false
  fail-on-insufficient-reviews:
    description: 'Fail the check if fewer than two models report (exit code 4). If false, posts a warning comment instead of failing.'
    required: false
    default: 'true'
  triage:
    description: >
      Ask the cheapest model whether the diff changes behaviour at all, and skip
      the review when it plainly does not. Off by default: it costs a model call
      and, unlike the path-based skip, it can be wrong.
    required: false
    default: 'false'
  max-reviews:
    description: >
      Most reviews to run on one PR. Once the PR already has this many tri-review
      reports, later runs skip before installing anything or calling any model
      (skip-reason 'cap') and pass. Only runs that produced a report count --
      "Nothing to review" skips, failures and cap notes do not. Empty (the
      default) means no cap.
    required: false
    default: ''
  force:
    description: >
      'true' ignores max-reviews for this run. Wire it to whatever your workflow
      treats as an explicit request, e.g. the expression
      github.event.action == 'labeled' with a label trigger. Which events,
      labels and people may force a run is the workflow's policy, not the
      Action's.
    required: false
    default: 'false'
  post-comment:
    description: 'Post a PR comment with the report.'
    required: false
    default: 'true'
  comment-mode:
    description: >
      'append' posts a new comment for every run and marks the previous ones
      outdated, so the PR keeps the whole review history in order. 'update'
      edits a single comment in place, which keeps a long PR quiet but leaves
      no record of what earlier commits were told.
    required: false
    default: 'append'
  github-token:
    description: 'Token used for gh auth and for posting the PR comment.'
    required: false
    default: ${{ github.token }}
  openai-api-key:
    description: 'OpenAI API key. At least two of the three provider keys are required.'
    required: false
  anthropic-api-key:
    description: 'Anthropic API key. At least two of the three provider keys are required.'
    required: false
  google-api-key:
    description: 'Google API key. At least two of the three provider keys are required.'
    required: false

outputs:
  report-path:
    description: 'Path to the written Markdown report, if one was produced.'
    value: ${{ steps.run.outputs.report-path }}
  exit-code:
    description: "tri-review's own exit code (see README: 0 success, 2 environment problem, 3 no such PR, 4 fewer than two reviews)."
    value: ${{ steps.run.outputs.exit-code || steps.cap.outputs.exit-code }}
  skipped:
    description: "'true' when no review was produced because nothing in the PR needed one."
    value: ${{ steps.run.outputs.skipped || steps.cap.outputs.skipped }}
  skip-reason:
    description: >
      Which gate stopped the run: 'path' (every changed file is documentation or
      generated), 'empty-diff', 'triage' (a model judged the diff to change no
      behaviour), or 'cap' (the PR already had max-reviews reports). 'path',
      'empty-diff' and 'cap' mean no provider call was made at all; 'triage'
      means one cheap call was spent reaching that verdict.
    value: ${{ steps.run.outputs.skip-reason || steps.cap.outputs.skip-reason }}

runs:
  using: 'composite'
  steps:
    - name: Check review cap
      id: cap
      shell: bash
      # First, so a capped run costs one comment listing and nothing else: no
      # Python, no install, no model call. See scripts/review_cap.sh for what
      # counts.
      #
      # Two pushes in quick succession can both count below the cap before
      # either posts. That is left to the consumer's per-PR `concurrency` group
      # (see README) rather than a lock in here: an Action cannot hold a lock
      # across runs, and the workflow already has the right primitive.
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        MAX_REVIEWS: ${{ inputs.max-reviews }}
        FORCE: ${{ inputs.force }}
        POST_COMMENT: ${{ inputs.post-comment }}
        MARKER: '<!-- tri-review-report -->'
      run: bash "${{ github.action_path }}/scripts/review_cap.sh"

    - name: Set up Python
      if: ${{ steps.cap.outputs.capped != 'true' }}
      # Pinned to a commit, not the mutable `v5` tag. This one is inherited by
      # every repo that uses this Action: a tag reference here means their runs
      # execute whatever `v5` points at on the day they run, which is a supply
      # chain they never opted into and cannot see. The SHA below is the tip of
      # v5.6.0, which is exactly what `v5` resolved to when this was pinned --
      # so this changes nothing about what runs today, only about who gets to
      # change it tomorrow.
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        python-version: '3.11'

    - name: Install tri-review
      if: ${{ steps.cap.outputs.capped != 'true' }}
      shell: bash
      # Constrained to requirements-lock.txt (generated from this repo's own
      # uv.lock -- see the "lock-action" Makefile target) so this resolves to
      # the exact versions the test suite runs against. An unconstrained `pip
      # install` re-resolves floors from pyproject.toml on every run and can
      # silently pick up a newer release the moment one is published -- that
      # is how a prior run ended up on a langchain-anthropic release this
      # repo had never tested against, which wrapped a routine Anthropic API
      # connection error in a renamed exception class before it reached us.
      run: pip install --constraint "${{ github.action_path }}/requirements-lock.txt" "${{ github.action_path }}"

    - name: Run tri-review
      id: run
      if: ${{ steps.cap.outputs.capped != 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        GOOGLE_API_KEY: ${{ inputs.google-api-key }}
        # Falls back to the triggering PR's number in the || expression below,
        # rather than relying on tri-review's own git-branch autodetection --
        # a pull_request checkout often leaves HEAD detached, where branch-based
        # PR lookup can't resolve anything.
        INPUT_PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        INPUT_MODELS: ${{ inputs.models }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_TRIAGE: ${{ inputs.triage }}
      run: |
        set +e
        args=(--output report.md)
        [ -n "$INPUT_PR_NUMBER" ] && args+=(--pr "$INPUT_PR_NUMBER")
        for m in $INPUT_MODELS; do
          args+=(--model "$m")
        done
        while IFS= read -r pattern; do
          [ -n "$pattern" ] && args+=(--exclude "$pattern")
        done <<< "$INPUT_EXCLUDE"
        [ "$INPUT_TRIAGE" = "true" ] && args+=(--triage)

        tri-review "${args[@]}" 2>&1 | tee tri-review-output.txt
        exit_code="${PIPESTATUS[0]}"
        set -e

        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"
        if [ -f report.md ]; then
          echo "report-path=report.md" >> "$GITHUB_OUTPUT"
        elif [ "$exit_code" -eq 0 ]; then
          # Exited clean without writing a report: a gate decided the PR did not
          # need one. That is a success, and must not be reported as "failed to
          # produce a report". The CLI prints a stable status line naming the
          # gate, because a path skip and a triage skip are not the same event.
          echo "skipped=true" >> "$GITHUB_OUTPUT"
          reason="$(sed -n 's/^tri-review-status: skipped:\(.*\)$/\1/p' tri-review-output.txt | tail -1)"
          echo "skip-reason=${reason:-unknown}" >> "$GITHUB_OUTPUT"
        fi
        exit 0  # pass/fail is decided in the "Enforce result" step, after the comment is posted

    - name: Post PR comment
      if: ${{ inputs.post-comment == 'true' && (inputs.pr-number || github.event.pull_request.number) }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ inputs.pr-number || github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        MODE: ${{ inputs.comment-mode }}
        SKIPPED: ${{ steps.run.outputs.skipped || steps.cap.outputs.skipped }}
        SKIP_REASON: ${{ steps.run.outputs.skip-reason || steps.cap.outputs.skip-reason }}
        EXIT_CODE: ${{ steps.run.outputs.exit-code || steps.cap.outputs.exit-code }}
        PRIOR_REVIEWS: ${{ steps.cap.outputs.prior-reviews }}
        MAX_REVIEWS: ${{ inputs.max-reviews }}
        BODY_FILE: comment-body.md
        MARKER: '<!-- tri-review-report -->'
      run: |
        # GitHub always shows a comment's original post time, not its last edit,
        # so an in-place update can look stale even seconds after it ran. This
        # line is the visible proof of freshness: which run produced this exact
        # body, and which commit it reviewed. In append mode it is also what
        # tells two adjacent reports apart.
        commit_sha="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
        attribution="_Posted by [workflow run]($RUN_URL) reviewing commit \`$commit_sha\`._"

        # pr_comment.sh inserts the running review tally under the marker; KIND
        # tells it whether this body is a report (and so counts).
        header() { echo "$MARKER"; echo; echo "$attribution"; echo; }

        # A capped run is decided first and on its own: tri-review never ran,
        # so any report.md in the workspace is not this run's.
        kind=""
        if [ "$SKIP_REASON" = "cap" ]; then
          # Not a report, so pr_comment.sh leaves the last real one visible and
          # edits the previous cap note, if that is the newest comment, in place.
          kind=cap
          {
            echo "$MARKER"
            echo '<!-- tri-review-cap -->'
            echo
            echo "_Posted by [workflow run]($RUN_URL) for commit \`$commit_sha\`._"
            echo
            echo "**Review cap reached ($PRIOR_REVIEWS/$MAX_REVIEWS).** This PR has already had $PRIOR_REVIEWS tri-review reviews, the most this workflow allows, so this commit was not reviewed and no model was called. The last report above still stands for the commit it names. To review this commit anyway, re-run with the Action's \`force\` input set to \`true\`."
          } > "$BODY_FILE"
        elif [ -f report.md ]; then
          kind=report
          { header; cat report.md; } > "$BODY_FILE"
        elif [ "$SKIPPED" = "true" ]; then
          # Each gate is a different event and must not read as another one.
          # A path skip spent nothing and knows exactly why; a triage skip spent
          # a model call on a judgement that can be wrong; an empty diff is not a
          # claim about file types at all. This branch used to assert
          # "documentation or generated output" for every non-triage reason,
          # including the `unknown` fallback the sed above writes when it finds
          # no status line -- a specific, checkable, false claim about the PR.
          case "$SKIP_REASON" in
            triage)
              headline="**Nothing to review.** A model read the diff and judged that it changes no behaviour. That is a judgement, not a path rule, so it can be wrong -- re-run with \`--no-triage\` (or set the \`triage\` input to \`false\`) to review it anyway."
              ;;
            path)
              headline="**Nothing to review.** Every file this PR changes is documentation or generated output, so no models were called."
              ;;
            empty-diff)
              headline="**Nothing to review.** This PR's diff came back empty, so there was nothing to send to any model. This is not a statement about what kind of files it changes -- see the output below for what was asked for and what came back."
              ;;
            *)
              headline="**Nothing to review.** A gate stopped this run before any model was called, but it did not name itself (skip-reason: \`$SKIP_REASON\`). Treat this as unreviewed and check the output below."
              ;;
          esac
          {
            header
            echo "$headline"
            echo
            echo '<details><summary>What was skipped</summary>'
            echo
            echo '```'
            tail -c 60000 tri-review-output.txt 2>/dev/null
            echo '```'
            echo
            echo '</details>'
          } > "$BODY_FILE"
        else
          {
            header
            echo "**tri-review failed to produce a report** (exit code $EXIT_CODE)."
            echo
            echo '<details><summary>Output</summary>'
            echo
            echo '```'
            tail -c 60000 tri-review-output.txt 2>/dev/null
            echo '```'
            echo
            echo '</details>'
          } > "$BODY_FILE"
        fi

        COMMIT_SHA="$commit_sha" KIND="$kind" bash "${{ github.action_path }}/scripts/pr_comment.sh"

    - name: Enforce result
      shell: bash
      env:
        FAIL_ON_INSUFFICIENT: ${{ inputs.fail-on-insufficient-reviews }}
        EXIT_CODE: ${{ steps.run.outputs.exit-code || steps.cap.outputs.exit-code }}
      run: |
        if [ "$EXIT_CODE" = "0" ]; then
          exit 0
        fi
        if [ "$EXIT_CODE" = "4" ] && [ "$FAIL_ON_INSUFFICIENT" != "true" ]; then
          echo "::warning::tri-review reported fewer than two reviews (exit 4); continuing because fail-on-insufficient-reviews is false."
          exit 0
        fi
        echo "::error::tri-review exited with code $EXIT_CODE"
        exit 1
