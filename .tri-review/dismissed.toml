# Findings a human has checked and rejected. See src/tri_review/dismissals.py
# and "Dismissing a finding" in the README.
#
# Read from the PR's base commit, never from the PR itself -- so an entry takes
# effect once it is merged, and a change cannot excuse its own findings.
#
# Handed to the synthesizer only, never to the three reviewers: a reviewer is
# still free to find the thing, and a dismissal only changes how it is
# reported. Every entry needs a reason, because the report shows it.
#
# [[dismissed]]
# file = "src/app/client.py"        # optional
# claim = "what the reviewers keep saying"
# reason = "why it is wrong, and what evidence would change your mind"
# date = "YYYY-MM-DD"               # optional
