[project]
name = "tri-review"
version = "0.1.0"
description = "Triangulated PR reviewer: three LLMs review a GitHub PR, a synthesizer reports consensus"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    # The langgraph/langchain floors are the versions this project was actually
    # built and tested against, not the oldest that might work. They were `>=0.2`
    # and `>=0.3` -- several majors below the resolved set -- which let a plain
    # `pip install -e .` produce an environment no one had ever run. If you lower
    # one of these, verify the provider adapters and `with_structured_output`
    # still behave, because that is where the majors moved.
    "langgraph>=1.2",
    "langchain-core>=1.5",
    "langchain-openai>=1.5",
    "langchain-anthropic>=1.5",
    "langchain-google-genai>=4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tri-review = "tri_review.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tri_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from the source tree directly, so the suite does not depend
# on an editable install being present and correctly wired.
pythonpath = ["src"]
