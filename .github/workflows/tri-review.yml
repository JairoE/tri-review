name: tri-review

on:
  pull_request:
    # `labeled` is how a PR asks for one more review past the cap: add
    # tri-review:again for the usual panel, or a tri-review:council-* /
    # tri-review:deep / tri-review:free label for a different one (see "Pick
    # the panel" below).
    types: [opened, synchronize, reopened, labeled]

permissions:
  pull-requests: write
  contents: read
  # Posting a comment needs only `pull-requests: write`; marking the previous
  # run's comment outdated is a moderation action and needs `issues: write` too.
  # Without it the Action still works -- it falls back to folding the old report
  # into a <details> block -- but the native "marked as outdated" collapse is
  # what you get with this line present.
  issues: write

jobs:
  review:
    # Any label starts a `labeled` run; only these should review. Keep this
    # list in step with the `case` in "Pick the panel".
    if: >-
      github.event.action != 'labeled' ||
      contains(fromJSON('["tri-review:again", "tri-review:council-gpt", "tri-review:council-claude", "tri-review:council-cross", "tri-review:deep", "tri-review:free"]'), github.event.label.name)
    # One review per PR at a time. On the job rather than the workflow, so a
    # run whose job is skipped by the `if` above (an unrelated label) never
    # joins the group and cannot displace a real review. Not
    # cancel-in-progress: a review is paid for as soon as its models are
    # called but only counted toward max-reviews once its comment posts, so
    # cancelling one mid-flight spends the money and loses the count. GitHub
    # keeps only the newest waiting run, so a burst of pushes still collapses
    # to the running review plus the latest commit.
    concurrency:
      group: tri-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Provider API keys are stored as secrets on the "env" GitHub Environment,
    # not as repo-level secrets -- a job only gets access to an environment's
    # secrets if it declares that environment explicitly.
    environment: env
    steps:
      # actions/checkout defaults to the pull_request event's synthetic merge
      # commit, not the PR's actual head -- pin to the head SHA explicitly so
      # the checked-out file contents match the diff tri-review reviews.
      #
      # Everything this step writes into the workspace is PR-authored and
      # therefore untrusted. It is read as *data* -- tri-review reads changed
      # file bodies out of the working tree (see context.filesystem_reader) and
      # falls back to a local `git diff` on diffs too large for GitHub's API.
      # Nothing in this job may execute it. See the step below.
      #
      # persist-credentials: false because checkout otherwise leaves the job's
      # GITHUB_TOKEN in .git/config as an http.extraheader, where any later step
      # running PR-authored code inherits write access to this repo for free.
      # tri-review never needs it: `gh` is authenticated through the GH_TOKEN
      # env var the Action sets explicitly, and the large-diff fallback fetches
      # this repo over its public HTTPS URL, which needs no credential.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Pinned to a commit already merged to main rather than `uses: ./`.
      #
      # `./` ran the action.yml from the checkout above -- PR-authored code --
      # as a composite action, with this job's environment secrets passed in as
      # inputs. GitHub withholds secrets from fork pull_request runs, but every
      # branch pushed to this repo opens a PR that does get them, so any such
      # branch could rewrite action.yml and walk out with all three provider
      # keys and a write-scoped token. Reviewing a diff must never mean running
      # it.
      #
      # The runner unpacks a remote action under its own github.action_path, so
      # the `pip install "${{ github.action_path }}"` inside installs the
      # released source; the PR checkout stays in the workspace as the data
      # tri-review reads. Consequence worth knowing: this reviews PRs with the
      # pinned trunk code, not with the PR's own src/ changes.
      #
      # What makes a SHA safe to pin here is that it is on main -- reviewed and
      # merged -- not that it carries a release tag. Never pin a commit that
      # exists only on a PR branch; that is PR-authored code again. Bump this
      # after merging changes CI should review with; until then, merged work
      # does not reach CI at all (it sat at v1.0.0 through three merges once).
      # Which models review this run, chosen by the label that triggered it.
      # Pushes and tri-review:again get the default panel.
      # The label name goes in through env, never spliced into the script.
      #
      # Default: two OpenAI reviewers and one Anthropic, so agreement can cross
      # a provider boundary. The synthesizer is set explicitly and is not on
      # the panel: unset, it is the first reviewer, which then judges its own
      # findings (#29). claude-sonnet-5, not 5.5: v1.2.1 gets a 400 from
      # sonnet-5-5 (it rejects the forced tool call tri-review uses), and on a
      # measured PR sonnet-5 was also the reviewer that found the most (#35).
      #
      # The council-gpt and council-claude panels are one provider each, for
      # comparing providers. Their agreement is weaker evidence than a mixed
      # panel's, since models from one provider tend to miss the same things.
      - name: Pick the panel
        id: panel
        env:
          LABEL: ${{ github.event.label.name }}
        run: |
          # The `if` compares labels ignoring case, as Actions expressions do;
          # match the same way so a capitalised label is not admitted there
          # and then rejected here.
          case "$(printf '%s' "$LABEL" | tr '[:upper:]' '[:lower:]')" in
            tri-review:council-gpt)
              reviewers="gpt-6-sol@high gpt-5.6-sol@high gpt-6-astra@medium"
              synthesizer="gpt-6.1-sol@medium" ;;
            tri-review:council-claude)
              # Only opus-5 and sonnet-5 are known to work here (see above),
              # so the synthesizer is a reviewer at lower effort and does
              # judge findings its own model made.
              reviewers="claude-opus-5@high claude-sonnet-5@high"
              synthesizer="claude-opus-5@medium" ;;
            tri-review:council-cross)
              # One reviewer per provider. Gemini gets no @effort suffix:
              # unsuffixed it runs at high, and lower levels were measured
              # returning empty reviews (providers.caveat_for).
              reviewers="gpt-6-sol@high claude-opus-5@high gemini-3.8-flash"
              synthesizer="gpt-6.1-sol@medium" ;;
            tri-review:deep)
              reviewers="gpt-6-sol@high gpt-5.6-sol@high claude-opus-5@high"
              synthesizer="gpt-6-astra@medium" ;;
            tri-review:free)
              # OpenAI's free daily tier, which needs data sharing on: PR
              # code reviewed here is shared with OpenAI. Reviewers draw on
              # the 250k tokens/day pool, the synthesizer on the separate
              # 2.5M/day mini pool. One provider, so weaker agreement, as
              # with council-gpt.
              reviewers="gpt-5.4@high gpt-5.2@high gpt-5.1@high"
              synthesizer="gpt-5.4-mini@medium" ;;
            "" | tri-review:again)
              reviewers="gpt-5.4@high gpt-5.2@xhigh o3@high"
              synthesizer="gpt-5.4-mini@medium" ;;
            *)
              # Admitted by the job's `if` but missing here: the two lists
              # have drifted. Fail rather than bill the default panel.
              echo "::error::No panel for label $LABEL; add it to this case"
              exit 1 ;;
          esac
          echo "Panel: $reviewers (report by $synthesizer)"
          {
            echo "reviewers=$reviewers"
            echo "synthesizer=$synthesizer"
          } >> "$GITHUB_OUTPUT"

      - name: Run tri-review on this PR
        uses: JairoE/tri-review@79cc027cd888946d2f80562328331c08a37bd351  # v1.3.0 (merge of #56, actionable findings)
        with:
          pr-number: ${{ github.event.pull_request.number }}
          synthesizer: ${{ steps.panel.outputs.synthesizer }}
          # Space-separated on purpose: the Action word-splits this input on
          # any whitespace (`for m in $INPUT_MODELS` in action.yml), so one
          # line or one model per line are the same to it.
          reviewers: ${{ steps.panel.outputs.reviewers }}
          # Two reviews per PR; any of the labels above forces one more.
          max-reviews: 2
          exclude: .github/**
          force: ${{ github.event.action == 'labeled' }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}

      # Take the label back off so adding it again is the next request. `|| true`:
      # a re-run of this job, or a hand removal, leaves nothing to delete, and
      # that must not turn a finished review red. Kept when "Pick the panel"
      # failed: a label with no panel stays on the PR as the visible sign that
      # the `if` list and the `case` have drifted.
      #
      # Known gap: GitHub keeps one pending run per concurrency group, so two
      # labels added while a review runs can drop the earlier request before
      # this step ever runs for it, leaving its label on. Add it again.
      - name: Remove the trigger label
        if: always() && github.event.action == 'labeled' && steps.panel.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ github.event.label.name }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/$LABEL" || true
