name: tri-review

on:
  pull_request:
    # `labeled` is how a PR at the review cap asks for one more: add the
    # tri-review:again label (see max-reviews / force below).
    types: [opened, synchronize, reopened, labeled]

permissions:
  pull-requests: write
  contents: read
  # Posting a comment needs only `pull-requests: write`; marking the previous
  # run's comment outdated is a moderation action and needs `issues: write` too.
  # Without it the Action still works -- it falls back to folding the old report
  # into a <details> block -- but the native "marked as outdated" collapse is
  # what you get with this line present.
  issues: write

jobs:
  review:
    # Any label starts a `labeled` run; only this one should review.
    if: github.event.action != 'labeled' || github.event.label.name == 'tri-review:again'
    # One review per PR at a time. On the job rather than the workflow, so a
    # run whose job is skipped by the `if` above (an unrelated label) never
    # joins the group and cannot displace a real review. Not
    # cancel-in-progress: a review is paid for as soon as its models are
    # called but only counted toward max-reviews once its comment posts, so
    # cancelling one mid-flight spends the money and loses the count. GitHub
    # keeps only the newest waiting run, so a burst of pushes still collapses
    # to the running review plus the latest commit.
    concurrency:
      group: tri-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Provider API keys are stored as secrets on the "env" GitHub Environment,
    # not as repo-level secrets -- a job only gets access to an environment's
    # secrets if it declares that environment explicitly.
    environment: env
    steps:
      # actions/checkout defaults to the pull_request event's synthetic merge
      # commit, not the PR's actual head -- pin to the head SHA explicitly so
      # the checked-out file contents match the diff tri-review reviews.
      #
      # Everything this step writes into the workspace is PR-authored and
      # therefore untrusted. It is read as *data* -- tri-review reads changed
      # file bodies out of the working tree (see context.filesystem_reader) and
      # falls back to a local `git diff` on diffs too large for GitHub's API.
      # Nothing in this job may execute it. See the step below.
      #
      # persist-credentials: false because checkout otherwise leaves the job's
      # GITHUB_TOKEN in .git/config as an http.extraheader, where any later step
      # running PR-authored code inherits write access to this repo for free.
      # tri-review never needs it: `gh` is authenticated through the GH_TOKEN
      # env var the Action sets explicitly, and the large-diff fallback fetches
      # this repo over its public HTTPS URL, which needs no credential.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Pinned to a commit already merged to main rather than `uses: ./`.
      #
      # `./` ran the action.yml from the checkout above -- PR-authored code --
      # as a composite action, with this job's environment secrets passed in as
      # inputs. GitHub withholds secrets from fork pull_request runs, but every
      # branch pushed to this repo opens a PR that does get them, so any such
      # branch could rewrite action.yml and walk out with all three provider
      # keys and a write-scoped token. Reviewing a diff must never mean running
      # it.
      #
      # The runner unpacks a remote action under its own github.action_path, so
      # the `pip install "${{ github.action_path }}"` inside installs the
      # released source; the PR checkout stays in the workspace as the data
      # tri-review reads. Consequence worth knowing: this reviews PRs with the
      # pinned trunk code, not with the PR's own src/ changes.
      #
      # What makes a SHA safe to pin here is that it is on main -- reviewed and
      # merged -- not that it carries a release tag. Never pin a commit that
      # exists only on a PR branch; that is PR-authored code again. Bump this
      # after merging changes CI should review with; until then, merged work
      # does not reach CI at all (it sat at v1.0.0 through three merges once).
      - name: Run tri-review on this PR
        uses: JairoE/tri-review@20ae6ae60912111a6e3c10dc8437ea950bb887b3  # v1.1.0
        with:
          pr-number: ${{ github.event.pull_request.number }}
          # Two reviews per PR; the tri-review:again label forces one more.
          max-reviews: 2
          force: ${{ github.event.action == 'labeled' }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}

      # Take the label back off so adding it again is the next request. `|| true`:
      # a re-run of this job, or a hand removal, leaves nothing to delete, and
      # that must not turn a finished review red.
      - name: Remove tri-review:again label
        if: always() && github.event.action == 'labeled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/tri-review:again" || true
