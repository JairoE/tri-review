name: tri-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel a still-running review for this PR when a newer commit arrives, rather
# than letting both finish. Two runs racing to post and minimize comments on the
# same PR is not a hard-constraint failure -- nothing goes unreviewed -- but it
# can leave two "current" reports visible if neither run sees the other's post
# before it lists prior comments. A cancelled run is also a wasted set of model
# calls the newer commit's own run is about to repeat, so this cuts real cost
# too, not just comment-history noise.
concurrency:
  group: tri-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: read
  # Posting a comment needs only `pull-requests: write`; marking the previous
  # run's comment outdated is a moderation action and needs `issues: write` too.
  # Without it the Action still works -- it falls back to folding the old report
  # into a <details> block -- but the native "marked as outdated" collapse is
  # what you get with this line present.
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Provider API keys are stored as secrets on the "env" GitHub Environment,
    # not as repo-level secrets -- a job only gets access to an environment's
    # secrets if it declares that environment explicitly.
    environment: env
    steps:
      # actions/checkout defaults to the pull_request event's synthetic merge
      # commit, not the PR's actual head -- pin to the head SHA explicitly so
      # the checked-out file contents match the diff tri-review reviews.
      #
      # Everything this step writes into the workspace is PR-authored and
      # therefore untrusted. It is read as *data* -- tri-review reads changed
      # file bodies out of the working tree (see context.filesystem_reader) and
      # falls back to a local `git diff` on diffs too large for GitHub's API.
      # Nothing in this job may execute it. See the step below.
      #
      # persist-credentials: false because checkout otherwise leaves the job's
      # GITHUB_TOKEN in .git/config as an http.extraheader, where any later step
      # running PR-authored code inherits write access to this repo for free.
      # tri-review never needs it: `gh` is authenticated through the GH_TOKEN
      # env var the Action sets explicitly, and the large-diff fallback fetches
      # this repo over its public HTTPS URL, which needs no credential.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Pinned to a released commit rather than `uses: ./`.
      #
      # `./` ran the action.yml from the checkout above -- PR-authored code --
      # as a composite action, with this job's environment secrets passed in as
      # inputs. GitHub withholds secrets from fork pull_request runs, but every
      # branch pushed to this repo opens a PR that does get them, so any such
      # branch could rewrite action.yml and walk out with all three provider
      # keys and a write-scoped token. Reviewing a diff must never mean running
      # it.
      #
      # The runner unpacks a remote action under its own github.action_path, so
      # the `pip install "${{ github.action_path }}"` inside installs the
      # released source; the PR checkout stays in the workspace as the data
      # tri-review reads. Consequence worth knowing: this reviews PRs with the
      # last release, not with the PR's own src/ changes. Bump this SHA when a
      # new version is released.
      - name: Run tri-review on this PR
        uses: JairoE/tri-review@0d69d8780d4fc6f62e7bf7ec8b0616d7851486b3  # main after #17: evidence-gated Blocking + dismissal ledger
        with:
          pr-number: ${{ github.event.pull_request.number }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
